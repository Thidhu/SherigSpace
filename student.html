<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<title>My Classroom — SherigSpace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-light:#e8c97a;--navy:#0f1623;--navy2:#1a2340;--surface:#192035;--border:rgba(201,168,76,0.2);--text:#e8e4dc;--text2:#9aa3b8;--red:#e05c5c;--green:#4caf84}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh}
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0f1623,#1a2340,#1a2f50);display:flex;align-items:center;justify-content:center;padding:1rem}
#gate.hide{display:none}
.gate-card{background:rgba(25,32,53,.98);border:1px solid var(--border);border-radius:10px;max-width:380px;padding:2rem;text-align:center}
.gate-icon{font-size:2.5rem;margin-bottom:.75rem}
.gate-card h2{font-family:'Playfair Display',serif;color:var(--gold-text,var(--gold));margin-bottom:.4rem}
.gate-card p{font-size:.85rem;color:var(--text2);margin-bottom:1.2rem}
.gate-btn{padding:11px 20px;background:var(--gold);color:var(--navy2);border:none;border-radius:5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-family:'DM Sans',sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 5%;border-bottom:1px solid var(--border);background:#131c2e}
.nav-logo{font-family:'Playfair Display',serif;color:var(--gold-text,var(--gold));font-size:1.2rem}
.nav-right{display:flex;align-items:center;gap:1rem;font-size:.85rem;color:var(--text2)}
.nav-right button{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.25);color:var(--red);padding:7px 14px;border-radius:4px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem}
main{max-width:800px;margin:0 auto;padding:2rem 5%}
.class-heading{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold-text,var(--gold));margin:1.6rem 0 .8rem}
.class-heading:first-child{margin-top:0}
.assign-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:6px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.assign-card.done{border-left-color:var(--green);opacity:.75}
.assign-title{font-weight:600;font-size:.95rem;margin-bottom:.3rem}
.answer-box{margin:.9rem 0 .5rem;padding:1rem;border:1px dashed var(--border);border-radius:10px;background:rgba(201,168,76,.06)}
.answer-title{font-weight:600;font-size:.9rem;margin-bottom:.55rem}
.answer-box textarea,.answer-box input[type=text]{width:100%;background:var(--surface2,#202b4a);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;padding:9px 11px;outline:none}
.answer-box textarea{min-height:110px;resize:vertical;line-height:1.55}
.answer-box textarea:focus,.answer-box input[type=text]:focus{border-color:var(--gold)}
.answer-add{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 .3rem}
.answer-add input[type=text]{flex:1;min-width:150px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.chips{display:flex;flex-direction:column;gap:.35rem;margin:.4rem 0}
.chip{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.4rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:.82rem;background:rgba(201,168,76,.05)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem}
.ans-status{font-size:.8rem;min-height:1.1rem;margin:.3rem 0 .5rem}
.ans-status.err{color:var(--err-text,#f09090)}.ans-status.ok{color:var(--ok-text,#7ed9b0)}.ans-status.wait{color:var(--text2)}
.submitted-note{font-size:.8rem;color:var(--ok-text,#7ed9b0);margin-bottom:.5rem}
.feedback-box{margin:.6rem 0;padding:.7rem .9rem;border-left:3px solid var(--gold);background:rgba(201,168,76,.08);border-radius:0 6px 6px 0;font-size:.86rem;line-height:1.6;white-space:pre-wrap}
.task-embed{position:relative;max-width:640px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:.5rem 0 .3rem}
.task-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.task-link{display:block;font-size:.78rem;color:var(--gold-text,var(--gold));text-decoration:none;margin:0 0 .8rem}
.task-link:hover{text-decoration:underline}
.task-linkbtn{display:inline-flex;align-items:center;gap:.5rem;padding:9px 14px;margin:.2rem .5rem .6rem 0;border:1px solid var(--border);border-radius:8px;background:rgba(201,168,76,.08);color:var(--gold-text,var(--gold));font-size:.85rem;font-weight:600;text-decoration:none}
.task-linkbtn:hover{background:rgba(201,168,76,.18)}
.assign-desc{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:.7rem}
.assign-meta{font-size:.76rem;color:var(--text2);margin-bottom:.8rem}
.assign-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:4px;font-size:.83rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.btn-gold{background:var(--gold);color:#1a2340}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-green{background:rgba(76,175,132,.15);border:1px solid rgba(76,175,132,.35);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty .ei{font-size:2.5rem;margin-bottom:.75rem}
.locked-note{font-size:.8rem;color:var(--gold-text,var(--gold));background:rgba(201,168,76,.08);border:1px solid var(--border);border-radius:5px;padding:.6rem .9rem;margin-bottom:.7rem}

a.btn{text-decoration:none;display:inline-block}
.btn-sm{padding:5px 11px;font-size:.78rem}
.assign-desc{white-space:pre-wrap}
.due-tag{display:inline-block;margin-left:.5rem;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700}
.due-tag.late{background:rgba(224,92,92,.14);color:var(--err-text,#f09090)}
.due-tag.soon{background:rgba(201,168,76,.18);color:var(--gold-text,var(--gold))}
.res-block{margin:.2rem 0 1rem}
.res-head{font-weight:600;font-size:.86rem;margin-bottom:.5rem}
.res-video{margin-bottom:.8rem}
.res-cap{font-size:.78rem;color:var(--text2);margin-top:.3rem}
.res-cap a{color:var(--gold-text,var(--gold));text-decoration:none}
.res-cap a:hover{text-decoration:underline}
.res-media{width:100%;max-width:640px;border-radius:10px;background:#000;display:block}
.res-img img{max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--border);display:block}
.res-audio{margin-bottom:.8rem}
.res-tile{border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem;background:rgba(201,168,76,.06)}
.res-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.res-ico{font-size:1.3rem}
.res-info{flex:1;min-width:140px}
.res-name{font-weight:600;font-size:.86rem;overflow-wrap:anywhere}
.res-sub{font-size:.74rem;color:var(--text2)}
.res-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.res-preview iframe{width:100%;height:420px;border:0;border-radius:8px;margin-top:.6rem;background:#fff}
.q-list{display:flex;flex-direction:column;gap:1rem;margin:.2rem 0 1rem}
.q-item{display:flex;flex-direction:column;gap:.45rem}
.q-text{font-size:.9rem;font-weight:500;line-height:1.5}
.q-num{display:inline-block;min-width:1.5rem;color:var(--gold-text,var(--gold));font-weight:700}
.q-item textarea{min-height:90px}
.q-opts{display:flex;flex-direction:column;gap:.35rem}
.q-opt{display:flex;align-items:flex-start;gap:.55rem;padding:.5rem .7rem;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.88rem;background:rgba(201,168,76,.04)}
.q-opt:hover{border-color:var(--gold)}
.q-opt input{margin-top:.2rem;accent-color:var(--gold)}
.answer-sub{font-size:.8rem;color:var(--text2);margin:.2rem 0 .4rem}
</style>
<script src="theme.js"></script>
</head>
<body>

<div id="gate">
  <div class="gate-card" id="gate-inner">
    <div class="gate-icon">🎓</div>
    <h2>Checking access…</h2>
    <p>One moment…</p>
  </div>
</div>

<div id="app" style="display:none">
  <nav>
    <div class="nav-logo">SherigSpace</div>
    <div class="nav-right">
      <span data-theme-slot></span>
      <span id="student-name">Student</span>
      <button onclick="logout()">Log Out</button>
    </div>
  </nav>
  <main id="assignments-wrap">
    <div class="empty"><div class="ei">📋</div><p>Loading your assignments…</p></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
import { SUPABASE_URL, SUPABASE_KEY, esc, safeUrl } from './config.js';
import { KIND_META, classifyUrl, defaultLabel, parseAttachments, parseQuestions } from './assignment-utils.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null;

const TYPE_ICON = { lessons:'📚', resources:'📁', videos:'🎥', articles:'✍️' };

async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  const gate = document.getElementById('gate-inner');
  if(!session){
    gate.innerHTML = `<div class="gate-icon">🔒</div><h2>Please log in</h2><p>Use the Student tab on the login page.</p><a class="gate-btn" href="login.html">Go to Login</a>`;
    return;
  }
  const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
  me = { id: session.user.id, name: profile?.name || 'Student' };

  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').style.display = 'block';
  document.getElementById('student-name').textContent = me.name;
  await checkAnswersEnabled();
  await renderAssignments();
}

window.logout = async function(){ await supabase.auth.signOut(); window.location.href = 'login.html'; };

async function renderAssignments(){
  const wrap = document.getElementById('assignments-wrap');

  const { data: enrollments } = await supabase.from('class_students').select('class_id, classes(id,name)').eq('student_id', me.id);
  if(!enrollments?.length){
    wrap.innerHTML = `<div class="empty"><div class="ei">🏫</div><p>You're not enrolled in any class yet. Ask your teacher to add you to a class.</p></div>`;
    return;
  }

  const classIds = enrollments.map(e=>e.class_id);
  const { data: assignments } = await supabase.from('assignments').select('*').in('class_id', classIds).order('created_at',{ascending:false});
  const { data: statuses } = await supabase.from('assignment_status').select('*').eq('student_id', me.id);
  const statusMap = {};
  (statuses||[]).forEach(s=>{
    statusMap[s.assignment_id] = s.status;
    statusRows[s.assignment_id] = s;
    if(!drafts[s.assignment_id]) drafts[s.assignment_id] = normDraft(loadLocalDraft(s.assignment_id) || {
      text: s.answer_text || '', links: splitLines(s.answer_links), files: splitLines(s.answer_files),
      answers: (s.answers && typeof s.answers === 'object') ? s.answers : {}
    });
  });

  if(!assignments?.length){
    wrap.innerHTML = `<div class="empty"><div class="ei">📋</div><p>No assignments yet — check back soon!</p></div>`;
    return;
  }
  assignments.forEach(a => { assignmentsById[String(a.id)] = a; });

  // Group by class
  const byClass = {};
  enrollments.forEach(e=>{ byClass[e.class_id] = { name: e.classes?.name || 'Class', items: [] }; });
  assignments.forEach(a=>{ if(byClass[a.class_id]) byClass[a.class_id].items.push(a); });

  let html = '';
  for(const classId of Object.keys(byClass)){
    const group = byClass[classId];
    if(!group.items.length) continue;
    html += `<div class="class-heading">🏫 ${esc(group.name)}</div>`;
    const cards = await Promise.all(group.items.map(a => renderAssignmentCard(a, statusMap[a.id] === 'done')));
    html += cards.join('');
  }
  wrap.innerHTML = html || `<div class="empty"><div class="ei">📋</div><p>No assignments yet.</p></div>`;

  wrap.querySelectorAll('[data-mark-done]').forEach(btn=>{
    btn.addEventListener('click', ()=>markDone(btn.getAttribute('data-mark-done')));
  });
  wrap.querySelectorAll('[data-open-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>window.open(btn.getAttribute('data-open-item'), '_blank', 'noopener'));
  });
  // "Preview" on documents / files: the frame is only created when asked for, so the page stays fast.
  wrap.querySelectorAll('[data-preview]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const box = btn.closest('.res-tile').querySelector('.res-preview');
      if(box.firstChild){ box.innerHTML = ''; btn.textContent = 'Preview'; return; }
      const f = document.createElement('iframe');
      f.src = btn.dataset.preview; f.title = 'Preview'; f.loading = 'lazy';
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.appendChild(f); btn.textContent = 'Hide preview';
    });
  });
  wireAnswerBoxes(wrap);
}

// ── Answers, links and photos/files submitted by the student ──
let answersEnabled = false;   // becomes true once sherigspace_task_answers.sql has been run
let questionsEnabled = false; // becomes true once sherigspace_assignments_v2.sql has been run
const drafts = {};            // assignment id -> { text, links[], files[], answers{} }
const statusRows = {};        // assignment id -> saved status row
const assignmentsById = {};   // assignment id -> assignment row
function splitLines(v){ return String(v || '').split(/\s*\n\s*/).filter(Boolean); }
function normDraft(d){ return Object.assign({ text:'', links:[], files:[], answers:{} }, d); }
function getDraft(id){ return drafts[id] || (drafts[id] = normDraft(loadLocalDraft(id) || {})); }

// Drafts are also kept on this device, so a refresh or a lost connection doesn't wipe what a student typed.
function draftKey(id){ return 'sherigDraft:' + me.id + ':' + id; }
function loadLocalDraft(id){ try{ const raw = localStorage.getItem(draftKey(id)); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveLocalDraft(id){ try{ localStorage.setItem(draftKey(id), JSON.stringify(getDraft(id))); }catch(e){} }
function clearLocalDraft(id){ try{ localStorage.removeItem(draftKey(id)); }catch(e){} }

async function checkAnswersEnabled(){
  const { error } = await supabase.from('assignment_status').select('answer_text').limit(1);
  answersEnabled = !error;
  const r2 = await supabase.from('assignment_status').select('answers,score').limit(1);
  questionsEnabled = !r2.error;
}
function fileLabel(path){ const n = String(path).split('/').pop() || ''; return n.replace(/^\d+-/, ''); }
function chipsHtml(id){
  const d = getDraft(id);
  const links = d.links.map((u,i)=>`<div class="chip"><span>🔗 ${esc(u)}</span><button type="button" data-rm-chip="${esc(id)}" data-kind="links" data-i="${i}">✕</button></div>`);
  const files = d.files.map((p,i)=>`<div class="chip"><span>📎 ${esc(fileLabel(p))}</span><button type="button" data-rm-chip="${esc(id)}" data-kind="files" data-i="${i}">✕</button></div>`);
  return links.concat(files).join('');
}
function boxFor(sel, id){ return [...document.querySelectorAll(sel)].find(e => e.dataset.id === id); }
function setAnsStatus(id, msg, cls){ const el = boxFor('.ans-status', id); if(el){ el.textContent = msg; el.className = 'ans-status ' + (cls||''); } }
function refreshChips(id){
  const el = boxFor('.chips', id); if(!el) return;
  el.innerHTML = chipsHtml(id);
  el.querySelectorAll('[data-rm-chip]').forEach(b => b.addEventListener('click', () => {
    getDraft(id)[b.dataset.kind].splice(Number(b.dataset.i), 1); saveLocalDraft(id); refreshChips(id);
  }));
}

// The teacher's questions for this task (short answer, paragraph, multiple choice).
function questionsFor(a){ return questionsEnabled ? parseQuestions(a) : []; }
function questionsHtml(a){
  const qs = questionsFor(a);
  if(!qs.length) return '';
  const id = String(a.id), d = getDraft(id);
  return `<div class="q-list">` + qs.map((q,i)=>{
    const val = d.answers[q.id] == null ? '' : String(d.answers[q.id]);
    const attrs = `data-q-input data-id="${esc(id)}" data-qid="${esc(q.id)}"`;
    let input;
    if(q.type === 'long') input = `<textarea ${attrs} placeholder="Write your answer…">${esc(val)}</textarea>`;
    else if(q.type === 'choice') input = `<div class="q-opts">${q.options.map(o =>
      `<label class="q-opt"><input type="radio" name="qr-${esc(id)}-${esc(q.id)}" ${attrs} data-val="${esc(o)}" ${val === o ? 'checked' : ''}/><span>${esc(o)}</span></label>`).join('')}</div>`;
    else input = `<input type="text" ${attrs} value="${esc(val)}" placeholder="Your answer…"/>`;
    return `<div class="q-item"><div class="q-text"><span class="q-num">${i+1}.</span>${esc(q.text)}</div>${input}</div>`;
  }).join('') + `</div>`;
}

function answerBoxHtml(a){
  const id = String(a.id), d = getDraft(id), row = statusRows[id] || {};
  const submitted = !!row.submitted_at;
  const hasQ = questionsFor(a).length > 0;
  const fb = [];
  if(row.score) fb.push(`<b>⭐ Marks: ${esc(row.score)}</b>`);
  if(row.teacher_feedback) fb.push(`<b>💬 Teacher feedback</b>`, esc(row.teacher_feedback));
  return `<div class="answer-box">
    <div class="answer-title">✍️ ${hasQ ? 'Your answers' : 'Your answer'}</div>
    ${submitted ? `<div class="submitted-note">✓ Submitted ${esc(new Date(row.submitted_at).toLocaleString())} — you can edit and submit again.</div>` : ''}
    ${questionsHtml(a)}
    ${hasQ ? `<div class="answer-sub">Anything else you want to tell your teacher? (optional)</div>` : ''}
    <textarea data-answer-text data-id="${esc(id)}" style="${hasQ ? 'min-height:70px' : ''}" placeholder="${hasQ ? 'Add a note…' : 'Write your answer here…'}">${esc(d.text)}</textarea>
    <div class="answer-add">
      <input type="text" data-link-input data-id="${esc(id)}" placeholder="Add a link (optional)"/>
      <button type="button" class="btn btn-ghost" data-add-link data-id="${esc(id)}">＋ Link</button>
      <label class="btn btn-ghost filebtn">📷 Photo / file
        <input type="file" hidden data-answer-file data-id="${esc(id)}" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.txt"/>
      </label>
    </div>
    <div class="chips" data-id="${esc(id)}">${chipsHtml(id)}</div>
    <div class="ans-status" data-id="${esc(id)}"></div>
    <button type="button" class="btn btn-gold" data-submit-answer data-id="${esc(id)}">${submitted ? 'Update my answers' : 'Submit answers'}</button>
  </div>${fb.length ? `<div class="feedback-box">${fb.join('<br>')}</div>` : ''}`;
}
function wireAnswerBoxes(root){
  root.querySelectorAll('[data-answer-text]').forEach(t => t.addEventListener('input', () => { getDraft(t.dataset.id).text = t.value; saveLocalDraft(t.dataset.id); }));
  root.querySelectorAll('[data-q-input]').forEach(el => el.addEventListener(el.type === 'radio' ? 'change' : 'input', () => {
    const d = getDraft(el.dataset.id);
    if(el.type === 'radio'){ if(el.checked) d.answers[el.dataset.qid] = el.dataset.val; }
    else d.answers[el.dataset.qid] = el.value;
    saveLocalDraft(el.dataset.id);
  }));
  root.querySelectorAll('[data-add-link]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, inp = boxFor('[data-link-input]', id);
    let v = (inp.value || '').trim(); if(!v) return;
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    const ok = safeUrl(v);
    if(!ok){ setAnsStatus(id, 'That does not look like a valid link.', 'err'); return; }
    getDraft(id).links.push(ok); saveLocalDraft(id); inp.value = ''; setAnsStatus(id, '', ''); refreshChips(id);
  }));
  root.querySelectorAll('[data-link-input]').forEach(i => i.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); boxFor('[data-add-link]', i.dataset.id).click(); }
  }));
  root.querySelectorAll('[data-answer-file]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.id, file = inp.files[0]; inp.value = '';
    if(!file) return;
    if(file.size > 20 * 1024 * 1024){ setAnsStatus(id, 'Please choose a file under 20 MB.', 'err'); return; }
    setAnsStatus(id, 'Uploading "' + file.name + '"…', 'wait');
    try{
      const path = `${me.id}/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const { error } = await supabase.storage.from('task-answers').upload(path, file);
      if(error) throw error;
      getDraft(id).files.push(path); saveLocalDraft(id); refreshChips(id); setAnsStatus(id, 'Added ✓ — press Submit when you are ready.', 'ok');
    }catch(err){ setAnsStatus(id, 'Upload failed: ' + err.message, 'err'); }
  }));
  root.querySelectorAll('[data-submit-answer]').forEach(b => b.addEventListener('click', () => submitAnswer(b.dataset.id, b)));
  root.querySelectorAll('.chips').forEach(c => refreshChips(c.dataset.id));
}
async function submitAnswer(id, btn){
  const d = getDraft(id);
  const qs = questionsFor(assignmentsById[id] || {});
  const cleanAnswers = {};
  qs.forEach(q => { const v = String(d.answers[q.id] == null ? '' : d.answers[q.id]).trim(); if(v) cleanAnswers[q.id] = v; });
  const answered = Object.keys(cleanAnswers).length;

  if(!answered && !d.text.trim() && !d.links.length && !d.files.length){
    setAnsStatus(id, qs.length ? 'Please answer at least one question, or add a note, link or file.' : 'Please write an answer, or add a link or file, first.', 'err');
    return;
  }
  const blank = qs.length - answered;
  if(blank > 0 && !confirm('You left ' + blank + ' question' + (blank > 1 ? 's' : '') + ' unanswered. Submit anyway?')) return;

  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Submitting…';
  const now = new Date().toISOString();
  const payload = {
    assignment_id: id, student_id: me.id, status: 'done', completed_at: now, submitted_at: now,
    answer_text: d.text.trim(), answer_links: d.links.join('\n'), answer_files: d.files.join('\n')
  };
  if(questionsEnabled) payload.answers = cleanAnswers;
  const { error } = await supabase.from('assignment_status').upsert(payload, { onConflict: 'assignment_id,student_id' });
  if(error){ setAnsStatus(id, 'Could not submit: ' + error.message, 'err'); btn.disabled = false; btn.textContent = label; return; }
  clearLocalDraft(id);
  await renderAssignments();
}

// ── Resources the teacher attached: videos play here, documents preview here, everything else opens ──
function resourceHtml(att){
  const c = classifyUrl(att.url);
  const kind = att.type && KIND_META[att.type] ? att.type : c.kind;
  const meta = KIND_META[kind] || KIND_META.link;
  const label = att.label || defaultLabel(att.url);
  const open = `<a href="${esc(att.url)}" target="_blank" rel="noopener noreferrer">↗ Open in a new tab</a>`;

  if(kind === 'video' && c.embed){
    return `<div class="res-video"><div class="task-embed"><iframe src="${esc(c.embed)}" title="${esc(label)}" loading="lazy" allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe></div><div class="res-cap">🎥 ${esc(label)} · ${open}</div></div>`;
  }
  if(c.media === 'video') return `<div class="res-video"><video class="res-media" controls preload="metadata" src="${esc(att.url)}"></video><div class="res-cap">🎥 ${esc(label)} · ${open}</div></div>`;
  if(c.media === 'audio') return `<div class="res-audio"><div class="res-cap" style="margin:0 0 .3rem">🎧 ${esc(label)}</div><audio controls preload="none" src="${esc(att.url)}" style="width:100%"></audio></div>`;
  if(c.media === 'image') return `<div class="res-video"><a class="res-img" href="${esc(att.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(att.url)}" alt="${esc(label)}" loading="lazy"/></a><div class="res-cap">🖼️ ${esc(label)}</div></div>`;

  return `<div class="res-tile"><div class="res-row">
    <span class="res-ico">${meta.icon}</span>
    <div class="res-info"><div class="res-name">${esc(label)}</div><div class="res-sub">${esc(c.name || meta.label)} · ${esc(c.host)}</div></div>
    <div class="res-btns">
      ${c.embed ? `<button type="button" class="btn btn-ghost btn-sm" data-preview="${esc(c.embed)}">Preview</button>` : ''}
      <a class="btn btn-gold btn-sm" href="${esc(att.url)}" target="_blank" rel="noopener noreferrer">${kind === 'form' ? 'Open form' : 'Open'}</a>
      ${c.download ? `<a class="btn btn-ghost btn-sm" href="${esc(c.download)}" target="_blank" rel="noopener noreferrer">Download</a>` : ''}
    </div></div><div class="res-preview"></div></div>`;
}
function resourcesHtml(list){
  if(!list.length) return '';
  return `<div class="res-block"><div class="res-head">📎 Resources for this task</div>${list.map(resourceHtml).join('')}</div>`;
}
// Shown when a task has instructions but nothing to open — so it's clear that's
// really the case, rather than looking like the page failed to load something.
function noResourceNote(){
  return `<div class="res-block" style="font-size:.83rem;color:var(--text2);padding:.6rem .8rem;border:1px dashed var(--border);border-radius:8px">Your teacher hasn't attached anything to open for this task yet.</div>`;
}

function dueHtml(a, done){
  if(!a.due_date) return '';
  const d = new Date(a.due_date + 'T00:00:00');
  if(isNaN(d)) return `<div class="assign-meta">📅 Due ${esc(a.due_date)}</div>`;
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today) / 86400000);
  let tag = '';
  if(!done){
    if(days < 0) tag = '<span class="due-tag late">Overdue</span>';
    else if(days === 0) tag = '<span class="due-tag soon">Due today</span>';
    else if(days === 1) tag = '<span class="due-tag soon">Due tomorrow</span>';
  }
  return `<div class="assign-meta">📅 Due ${esc(d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' }))}${tag}</div>`;
}

async function renderAssignmentCard(a, done){
  let title, desc, lockedNote = '', resources = parseAttachments(a);

  if(a.kind === 'custom'){
    title = a.title || 'Task';
    desc = a.description || '';
  } else {
    const { data: item } = await supabase.from(a.item_type+'_public').select('*').eq('id', a.item_id).single();
    title = a.title || (item ? `${TYPE_ICON[a.item_type]||'📄'} ${item.title}` : '(content unavailable)');
    desc = [a.description, item?.description].filter(Boolean).join('\n\n');
    if(item){
      if(item.is_premium && !item.url){
        lockedNote = `<div class="locked-note">🔒 This is premium content — visit the <a href="index.html" style="color:var(--gold-text,var(--gold))">TLM Store</a> to unlock it first.</div>`;
      } else {
        // the library item first, then whatever the teacher added on top
        resources = parseAttachments({ attachment_url: item.url }).concat(resources);
      }
    }
  }

  const hasQ = questionsFor(a).length > 0;
  return `<div class="assign-card ${done?'done':''}">
    <div class="assign-title">${esc(title)}</div>
    ${dueHtml(a, done)}
    ${desc ? `<div class="assign-desc">${esc(desc)}</div>` : ''}
    ${resources.length ? resourcesHtml(resources) : (lockedNote ? '' : noResourceNote())}
    ${lockedNote}
    ${answersEnabled && !lockedNote ? answerBoxHtml(a) : ''}
    <div class="assign-actions">
      ${done
        ? `<button class="btn btn-green" disabled>✓ Completed</button>`
        : (hasQ ? '' : `<button class="btn btn-ghost" data-mark-done="${esc(a.id)}">Mark Complete</button>`)}
    </div>
  </div>`;
}

window.markDone = async function(assignmentId){
  const { error } = await supabase.from('assignment_status').upsert({
    assignment_id: assignmentId, student_id: me.id, status: 'done', completed_at: new Date().toISOString()
  }, { onConflict: 'assignment_id,student_id' });
  if(error){ alert('Error: ' + error.message); return; }
  renderAssignments();
};

init();
