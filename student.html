<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<title>My Classroom — SherigSpace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-light:#e8c97a;--navy:#0f1623;--navy2:#1a2340;--surface:#192035;--border:rgba(201,168,76,0.2);--text:#e8e4dc;--text2:#9aa3b8;--red:#e05c5c;--green:#4caf84}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh}
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0f1623,#1a2340,#1a2f50);display:flex;align-items:center;justify-content:center;padding:1rem}
#gate.hide{display:none}
.gate-card{background:rgba(25,32,53,.98);border:1px solid var(--border);border-radius:10px;max-width:380px;padding:2rem;text-align:center}
.gate-icon{font-size:2.5rem;margin-bottom:.75rem}
.gate-card h2{font-family:'Playfair Display',serif;color:var(--gold-text,var(--gold));margin-bottom:.4rem}
.gate-card p{font-size:.85rem;color:var(--text2);margin-bottom:1.2rem}
.gate-btn{padding:11px 20px;background:var(--gold);color:var(--navy2);border:none;border-radius:5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-family:'DM Sans',sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 5%;border-bottom:1px solid var(--border);background:#131c2e}
.nav-logo{font-family:'Playfair Display',serif;color:var(--gold-text,var(--gold));font-size:1.2rem}
.nav-right{display:flex;align-items:center;gap:1rem;font-size:.85rem;color:var(--text2)}
.nav-right button{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.25);color:var(--red);padding:7px 14px;border-radius:4px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem}
main{max-width:800px;margin:0 auto;padding:2rem 5%}
.class-heading{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold-text,var(--gold));margin:1.6rem 0 .8rem}
.class-heading:first-child{margin-top:0}
.assign-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:6px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.assign-card.done{border-left-color:var(--green);opacity:.75}
.assign-title{font-weight:600;font-size:.95rem;margin-bottom:.3rem}
.answer-box{margin:.9rem 0 .5rem;padding:1rem;border:1px dashed var(--border);border-radius:10px;background:rgba(201,168,76,.06)}
.answer-title{font-weight:600;font-size:.9rem;margin-bottom:.55rem}
.answer-box textarea,.answer-box input[type=text]{width:100%;background:var(--surface2,#202b4a);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;padding:9px 11px;outline:none}
.answer-box textarea{min-height:110px;resize:vertical;line-height:1.55}
.answer-box textarea:focus,.answer-box input[type=text]:focus{border-color:var(--gold)}
.answer-add{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 .3rem}
.answer-add input[type=text]{flex:1;min-width:150px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.chips{display:flex;flex-direction:column;gap:.35rem;margin:.4rem 0}
.chip{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.4rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:.82rem;background:rgba(201,168,76,.05)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem}
.ans-status{font-size:.8rem;min-height:1.1rem;margin:.3rem 0 .5rem}
.ans-status.err{color:var(--err-text,#f09090)}.ans-status.ok{color:var(--ok-text,#7ed9b0)}.ans-status.wait{color:var(--text2)}
.submitted-note{font-size:.8rem;color:var(--ok-text,#7ed9b0);margin-bottom:.5rem}
.feedback-box{margin:.6rem 0;padding:.7rem .9rem;border-left:3px solid var(--gold);background:rgba(201,168,76,.08);border-radius:0 6px 6px 0;font-size:.86rem;line-height:1.6;white-space:pre-wrap}
.task-embed{position:relative;max-width:640px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:.5rem 0 .3rem}
.task-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.task-link{display:block;font-size:.78rem;color:var(--gold-text,var(--gold));text-decoration:none;margin:0 0 .8rem}
.task-link:hover{text-decoration:underline}
.task-linkbtn{display:inline-flex;align-items:center;gap:.5rem;padding:9px 14px;margin:.2rem .5rem .6rem 0;border:1px solid var(--border);border-radius:8px;background:rgba(201,168,76,.08);color:var(--gold-text,var(--gold));font-size:.85rem;font-weight:600;text-decoration:none}
.task-linkbtn:hover{background:rgba(201,168,76,.18)}
.assign-desc{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:.7rem}
.assign-meta{font-size:.76rem;color:var(--text2);margin-bottom:.8rem}
.assign-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:4px;font-size:.83rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.btn-gold{background:var(--gold);color:#1a2340}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-green{background:rgba(76,175,132,.15);border:1px solid rgba(76,175,132,.35);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty .ei{font-size:2.5rem;margin-bottom:.75rem}
.locked-note{font-size:.8rem;color:var(--gold-text,var(--gold));background:rgba(201,168,76,.08);border:1px solid var(--border);border-radius:5px;padding:.6rem .9rem;margin-bottom:.7rem}
</style>
<script src="theme.js"></script>
</head>
<body>

<div id="gate">
  <div class="gate-card" id="gate-inner">
    <div class="gate-icon">🎓</div>
    <h2>Checking access…</h2>
    <p>One moment…</p>
  </div>
</div>

<div id="app" style="display:none">
  <nav>
    <div class="nav-logo">SherigSpace</div>
    <div class="nav-right">
      <span data-theme-slot></span>
      <span id="student-name">Student</span>
      <button onclick="logout()">Log Out</button>
    </div>
  </nav>
  <main id="assignments-wrap">
    <div class="empty"><div class="ei">📋</div><p>Loading your assignments…</p></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
import { SUPABASE_URL, SUPABASE_KEY, esc, safeUrl } from './config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null;

const TYPE_ICON = { lessons:'📚', resources:'📁', videos:'🎥', articles:'✍️' };

async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  const gate = document.getElementById('gate-inner');
  if(!session){
    gate.innerHTML = `<div class="gate-icon">🔒</div><h2>Please log in</h2><p>Use the Student tab on the login page.</p><a class="gate-btn" href="login.html">Go to Login</a>`;
    return;
  }
  const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
  me = { id: session.user.id, name: profile?.name || 'Student' };

  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').style.display = 'block';
  document.getElementById('student-name').textContent = me.name;
  await checkAnswersEnabled();
  await renderAssignments();
}

window.logout = async function(){ await supabase.auth.signOut(); window.location.href = 'login.html'; };

async function renderAssignments(){
  const wrap = document.getElementById('assignments-wrap');

  const { data: enrollments } = await supabase.from('class_students').select('class_id, classes(id,name)').eq('student_id', me.id);
  if(!enrollments?.length){
    wrap.innerHTML = `<div class="empty"><div class="ei">🏫</div><p>You're not enrolled in any class yet. Ask your teacher to add you to a class.</p></div>`;
    return;
  }

  const classIds = enrollments.map(e=>e.class_id);
  const { data: assignments } = await supabase.from('assignments').select('*').in('class_id', classIds).order('created_at',{ascending:false});
  const { data: statuses } = await supabase.from('assignment_status').select('*').eq('student_id', me.id);
  const statusMap = {};
  (statuses||[]).forEach(s=>{
    statusMap[s.assignment_id] = s.status;
    statusRows[s.assignment_id] = s;
    if(!drafts[s.assignment_id]) drafts[s.assignment_id] = { text: s.answer_text || '', links: splitLines(s.answer_links), files: splitLines(s.answer_files) };
  });

  if(!assignments?.length){
    wrap.innerHTML = `<div class="empty"><div class="ei">📋</div><p>No assignments yet — check back soon!</p></div>`;
    return;
  }

  // Group by class
  const byClass = {};
  enrollments.forEach(e=>{ byClass[e.class_id] = { name: e.classes?.name || 'Class', items: [] }; });
  assignments.forEach(a=>{ if(byClass[a.class_id]) byClass[a.class_id].items.push(a); });

  let html = '';
  for(const classId of Object.keys(byClass)){
    const group = byClass[classId];
    if(!group.items.length) continue;
    html += `<div class="class-heading">🏫 ${esc(group.name)}</div>`;
    for(const a of group.items){
      const done = statusMap[a.id] === 'done';
      html += await renderAssignmentCard(a, done);
    }
  }
  wrap.innerHTML = html || `<div class="empty"><div class="ei">📋</div><p>No assignments yet.</p></div>`;

  wrap.querySelectorAll('[data-mark-done]').forEach(btn=>{
    btn.addEventListener('click', ()=>markDone(btn.getAttribute('data-mark-done')));
  });
  wrap.querySelectorAll('[data-open-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>window.open(btn.getAttribute('data-open-item'), '_blank', 'noopener'));
  });
  wireAnswerBoxes(wrap);
}

// ── Written answers, links and photos/files submitted by the student ──
let answersEnabled = false;   // becomes true once the setup SQL has been run
const drafts = {};            // assignment id -> { text, links[], files[] }
const statusRows = {};        // assignment id -> saved status row
function splitLines(v){ return String(v || '').split(/\s*\n\s*/).filter(Boolean); }
function getDraft(id){ return drafts[id] || (drafts[id] = { text:'', links:[], files:[] }); }
async function checkAnswersEnabled(){
  const { error } = await supabase.from('assignment_status').select('answer_text').limit(1);
  answersEnabled = !error;
}
function fileLabel(path){ const n = String(path).split('/').pop() || ''; return n.replace(/^\d+-/, ''); }
function chipsHtml(id){
  const d = getDraft(id);
  const links = d.links.map((u,i)=>`<div class="chip"><span>🔗 ${esc(u)}</span><button type="button" data-rm-chip="${esc(id)}" data-kind="links" data-i="${i}">✕</button></div>`);
  const files = d.files.map((p,i)=>`<div class="chip"><span>📎 ${esc(fileLabel(p))}</span><button type="button" data-rm-chip="${esc(id)}" data-kind="files" data-i="${i}">✕</button></div>`);
  return links.concat(files).join('');
}
function boxFor(sel, id){ return [...document.querySelectorAll(sel)].find(e => e.dataset.id === id); }
function setAnsStatus(id, msg, cls){ const el = boxFor('.ans-status', id); if(el){ el.textContent = msg; el.className = 'ans-status ' + (cls||''); } }
function refreshChips(id){
  const el = boxFor('.chips', id); if(!el) return;
  el.innerHTML = chipsHtml(id);
  el.querySelectorAll('[data-rm-chip]').forEach(b => b.addEventListener('click', () => {
    getDraft(id)[b.dataset.kind].splice(Number(b.dataset.i), 1); refreshChips(id);
  }));
}
function answerBoxHtml(a){
  const id = String(a.id), d = getDraft(id), row = statusRows[id] || {};
  const submitted = !!row.submitted_at;
  return `<div class="answer-box">
    <div class="answer-title">✍️ Your answer</div>
    ${submitted ? `<div class="submitted-note">✓ Submitted ${esc(new Date(row.submitted_at).toLocaleString())} — you can edit and submit again.</div>` : ''}
    <textarea data-answer-text data-id="${esc(id)}" placeholder="Write your answer here…">${esc(d.text)}</textarea>
    <div class="answer-add">
      <input type="text" data-link-input data-id="${esc(id)}" placeholder="Add a link (optional)"/>
      <button type="button" class="btn btn-ghost" data-add-link data-id="${esc(id)}">＋ Link</button>
      <label class="btn btn-ghost filebtn">📷 Photo / file
        <input type="file" hidden data-answer-file data-id="${esc(id)}" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.txt"/>
      </label>
    </div>
    <div class="chips" data-id="${esc(id)}">${chipsHtml(id)}</div>
    <div class="ans-status" data-id="${esc(id)}"></div>
    <button type="button" class="btn btn-gold" data-submit-answer data-id="${esc(id)}">${submitted ? 'Update my answer' : 'Submit answer'}</button>
  </div>${row.teacher_feedback ? `<div class="feedback-box"><b>💬 Teacher feedback</b><br>${esc(row.teacher_feedback)}</div>` : ''}`;
}
function wireAnswerBoxes(root){
  root.querySelectorAll('[data-answer-text]').forEach(t => t.addEventListener('input', () => { getDraft(t.dataset.id).text = t.value; }));
  root.querySelectorAll('[data-add-link]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, inp = boxFor('[data-link-input]', id);
    let v = (inp.value || '').trim(); if(!v) return;
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    const ok = safeUrl(v);
    if(!ok){ setAnsStatus(id, 'That does not look like a valid link.', 'err'); return; }
    getDraft(id).links.push(ok); inp.value = ''; setAnsStatus(id, '', ''); refreshChips(id);
  }));
  root.querySelectorAll('[data-link-input]').forEach(i => i.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); boxFor('[data-add-link]', i.dataset.id).click(); }
  }));
  root.querySelectorAll('[data-answer-file]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.id, file = inp.files[0]; inp.value = '';
    if(!file) return;
    if(file.size > 20 * 1024 * 1024){ setAnsStatus(id, 'Please choose a file under 20 MB.', 'err'); return; }
    setAnsStatus(id, 'Uploading "' + file.name + '"…', 'wait');
    try{
      const path = `${me.id}/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const { error } = await supabase.storage.from('task-answers').upload(path, file);
      if(error) throw error;
      getDraft(id).files.push(path); refreshChips(id); setAnsStatus(id, 'Added ✓ — press Submit answer when you are ready.', 'ok');
    }catch(err){ setAnsStatus(id, 'Upload failed: ' + err.message, 'err'); }
  }));
  root.querySelectorAll('[data-submit-answer]').forEach(b => b.addEventListener('click', () => submitAnswer(b.dataset.id, b)));
  root.querySelectorAll('.chips').forEach(c => refreshChips(c.dataset.id));
}
async function submitAnswer(id, btn){
  const d = getDraft(id);
  if(!d.text.trim() && !d.links.length && !d.files.length){ setAnsStatus(id, 'Please write an answer, or add a link or file, first.', 'err'); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Submitting…';
  const now = new Date().toISOString();
  const { error } = await supabase.from('assignment_status').upsert({
    assignment_id: id, student_id: me.id, status: 'done', completed_at: now, submitted_at: now,
    answer_text: d.text.trim(), answer_links: d.links.join('\n'), answer_files: d.files.join('\n')
  }, { onConflict: 'assignment_id,student_id' });
  if(error){ setAnsStatus(id, 'Could not submit: ' + error.message, 'err'); btn.disabled = false; btn.textContent = label; return; }
  await renderAssignments();
}

// Turns the saved attachment text (one link per line) into videos/players/buttons.
function embedFor(url){
  let u; try{ u = new URL(url); }catch(e){ return null; }
  const host = u.hostname.replace(/^www\./,'');
  let id = null;
  if(host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if(host.endsWith('youtube.com') || host === 'youtube-nocookie.com'){
    if(u.pathname === '/watch') id = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{6,})/); if(m) id = m[1]; }
  }
  if(id && /^[\w-]{6,}$/.test(id)) return 'https://www.youtube-nocookie.com/embed/' + id;
  if(host === 'vimeo.com'){ const m = u.pathname.match(/^\/(\d+)/); if(m) return 'https://player.vimeo.com/video/' + m[1]; }
  if(host === 'drive.google.com'){ const m = u.pathname.match(/\/file\/d\/([\w-]+)/); if(m) return 'https://drive.google.com/file/d/' + m[1] + '/preview'; }
  return null;
}
function renderAttachments(raw){
  const urls = String(raw || '').split(/\s*\n\s*/).map(safeUrl).filter(Boolean);
  return urls.map(url => {
    const embed = embedFor(url);
    if(embed){
      return `<div class="task-embed"><iframe src="${esc(embed)}" title="Task media" loading="lazy" allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"
        sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe></div>
        <a class="task-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ Open in a new tab</a>`;
    }
    let host = url; try{ host = new URL(url).hostname.replace(/^www\./,''); }catch(e){}
    return `<a class="task-linkbtn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 Open ${esc(host)}</a>`;
  }).join('');
}

async function renderAssignmentCard(a, done){
  let title, desc, openUrl = null, lockedNote = '', attachmentsHtml = '';

  if(a.kind === 'custom'){
    title = a.title;
    desc = a.description || '';
    attachmentsHtml = renderAttachments(a.attachment_url);
  } else {
    const { data: item } = await supabase.from(a.item_type+'_public').select('*').eq('id', a.item_id).single();
    title = item ? `${TYPE_ICON[a.item_type]||'📄'} ${item.title}` : '(content unavailable)';
    desc = item?.description || '';
    if(item){
      if(item.is_premium && !item.url){
        lockedNote = `<div class="locked-note">🔒 This is premium content — visit the <a href="index.html" style="color:var(--gold-text,var(--gold))">TLM Store</a> to unlock it first.</div>`;
      } else {
        attachmentsHtml = renderAttachments(item.url);
      }
    }
  }

  return `<div class="assign-card ${done?'done':''}">
    <div class="assign-title">${esc(title)}</div>
    ${desc?`<div class="assign-desc">${esc(desc)}</div>`:''}
    ${a.due_date?`<div class="assign-meta">📅 Due ${esc(a.due_date)}</div>`:''}
    ${attachmentsHtml}
    ${lockedNote}
    ${answersEnabled && !lockedNote ? answerBoxHtml(a) : ''}
    <div class="assign-actions">
      ${openUrl?`<button class="btn btn-gold" data-open-item="${esc(openUrl)}">Open</button>`:''}
      ${done
        ? `<button class="btn btn-green" disabled>✓ Completed</button>`
        : `<button class="btn btn-ghost" data-mark-done="${esc(a.id)}">Mark Complete</button>`}
    </div>
  </div>`;
}

window.markDone = async function(assignmentId){
  const { error } = await supabase.from('assignment_status').upsert({
    assignment_id: assignmentId, student_id: me.id, status: 'done', completed_at: new Date().toISOString()
  }, { onConflict: 'assignment_id,student_id' });
  if(error){ alert('Error: ' + error.message); return; }
  renderAssignments();
};

init();
</script>
</body>
</html>
